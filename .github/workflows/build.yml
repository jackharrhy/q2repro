name: build

on:
  push:
    branches: [notscared]
  workflow_dispatch:

env:
  # FIXME: Re-add '--fatal-meson-warnings' when meson fixed 'CMake Toolchain: Failed to determine CMake compilers state' w/ openal
  MESON_ARGS: >-
    -Danticheat-server=true
    -Dpacketdup-hack=true
    -Dtests=true
    -Dwerror=true
    -Davcodec=enabled
    -Dffmpeg:werror=false
    -Dlibcurl=enabled
    -Dlibjpeg=enabled
    -Dlibpng=enabled
    -Dopenal=enabled
    -Dopenal-soft:werror=false
    -Dsoftware-sound=enabled
    -Dzlib=enabled

  MESON_ARGS_WIN: >-
    -Dicmp-errors=enabled
    --force-fallback-for=zlib
    -Dwindows-crash-dumps=enabled

  MESON_ARGS_LINUX: >-
    -Dwrap_mode=nofallback
    --force-fallback-for=fmt,jsoncpp,ffmpeg
    -Dsdl2=enabled
    -Dwayland=enabled
    -Dx11=enabled

  MESON_ARGS_MACOS: >-
    -Dbuildtype=release
    -Dicmp-errors=disabled
    -Dpkg_config_path=/opt/homebrew/opt/openal-soft/lib/pkgconfig
    -Dwrap_mode=nofallback
    --force-fallback-for=fmt,jsoncpp,ffmpeg

jobs:
  mingw:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/cache@v4
        with:
          path: subprojects/packagecache
          key: ${{ hashFiles('subprojects/*.wrap') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64 g++-mingw-w64 nasm meson ninja-build

      - name: Build - meson setup
        run: |
          meson setup --cross-file=.ci/x86_64-w64-mingw32.txt \
            ${{ env.MESON_ARGS }} ${{ env.MESON_ARGS_WIN }} builddir

      - name: Build info - meson configure
        run: |
          meson configure builddir

      - name: Build - meson compile
        run: |
          meson compile -C builddir
          meson install -C builddir --tags runtime --destdir ${{ github.workspace }}/installdir

      - name: Setup variables
        uses: actions/github-script@v7
        with:
          script: core.exportVariable('GITHUB_SHA_SHORT', context.sha.substring(0, 7))

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: q2pro-rr-windows-mingw-x86_64-${{env.GITHUB_SHA_SHORT}}
          path: installdir/

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson libsdl2-dev libopenal-dev \
            libpng-dev libjpeg-dev zlib1g-dev mesa-common-dev \
            libcurl4-gnutls-dev libx11-dev libxi-dev \
            libwayland-dev wayland-protocols libdecor-0-dev

      - name: Build - meson setup
        run: |
          meson setup ${{ env.MESON_ARGS }} ${{ env.MESON_ARGS_LINUX }} builddir

      - name: Build info - meson configure
        run: |
          meson configure builddir

      - name: Build - meson compile
        run: |
          meson compile -C builddir
          meson install -C builddir --tags runtime --destdir ${{ github.workspace }}/installdir

      - name: Setup variables
        uses: actions/github-script@v7
        with:
          script: core.exportVariable('GITHUB_SHA_SHORT', context.sha.substring(0, 7))

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: q2pro-rr-linux-gcc-x86_64-${{env.GITHUB_SHA_SHORT}}
          path: installdir/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          brew update
          brew install meson sdl2 openal-soft libpng jpeg-turbo

      - name: Build - meson setup
        run: |
          meson setup ${{ env.MESON_ARGS }} ${{ env.MESON_ARGS_MACOS }} builddir

      - name: Build info - meson configure
        run: |
          meson configure builddir

      - name: Build - meson compile
        run: |
          meson compile -C builddir
          meson install -C builddir --tags runtime --destdir ${{ github.workspace }}/installdir

      - name: Setup variables
        uses: actions/github-script@v7
        with:
          script: core.exportVariable('GITHUB_SHA_SHORT', context.sha.substring(0, 7))

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: q2pro-rr-macos-arm64-${{env.GITHUB_SHA_SHORT}}
          path: installdir/

  release:
    needs: [mingw, linux, macos]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/notscared'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Setup variables
        uses: actions/github-script@v7
        with:
          script: core.exportVariable('GITHUB_SHA_SHORT', context.sha.substring(0, 7))

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create release if it doesn't exist, or update if it does
          if gh release view latest 2>/dev/null; then
            gh release edit latest -t "Latest Build (${{env.GITHUB_SHA_SHORT}})" -n "Latest build from notscared branch" --latest
          else
            gh release create latest -t "Latest Build (${{env.GITHUB_SHA_SHORT}})" -n "Latest build from notscared branch" --latest
          fi

      - name: Install MinGW for DLL extraction
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64 g++-mingw-w64

      - name: Package Windows artifacts
        run: |
          mkdir -p package/q2repro/baseq2
          cd artifacts/q2pro-rr-windows-mingw-x86_64-*
          cp usr/local/q2repro.exe ../../package/q2repro/
          cp usr/local/q2reproded.exe ../../package/q2repro/
          cp usr/local/baseq2/game_x64.dll ../../package/q2repro/baseq2/ 2>/dev/null || true
          cd ../..
          # Copy MinGW runtime DLLs (use -print-file-name to find exact paths)
          cp "$(x86_64-w64-mingw32-gcc -print-file-name=libgcc_s_seh-1.dll)" package/q2repro/
          cp "$(x86_64-w64-mingw32-g++ -print-file-name=libstdc++-6.dll)" package/q2repro/
          cp "$(x86_64-w64-mingw32-gcc -print-file-name=libwinpthread-1.dll)" package/q2repro/
          cd package
          zip -r ../q2repro-windows-x86_64.zip q2repro
          cd ..

      - name: Package Linux artifacts
        run: |
          mkdir -p package/q2repro/baseq2
          cd artifacts/q2pro-rr-linux-gcc-x86_64-*
          cp usr/local/q2repro ../../package/q2repro/
          cp usr/local/q2reproded ../../package/q2repro/
          cp usr/local/baseq2/game_x86_64.so ../../package/q2repro/baseq2/ 2>/dev/null || true
          cd ../..
          cd package
          tar czf ../q2repro-linux-x86_64.tar.gz q2repro
          cd ..

      - name: Package macOS artifacts
        run: |
          mkdir -p package/q2repro/baseq2
          cd artifacts/q2pro-rr-macos-arm64-*
          cp opt/homebrew/q2repro ../../package/q2repro/
          cp opt/homebrew/q2reproded ../../package/q2repro/
          cp opt/homebrew/baseq2/game_arm64.dylib ../../package/q2repro/baseq2/ 2>/dev/null || true
          cd ../..
          cd package
          tar czf ../q2repro-macos-arm64.tar.gz q2repro
          cd ..

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload latest q2repro-windows-x86_64.zip --clobber
          gh release upload latest q2repro-linux-x86_64.tar.gz --clobber
          gh release upload latest q2repro-macos-arm64.tar.gz --clobber
